<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in with a passkey</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="vault.css">
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="passkey.js" defer></script>
</head>
<body class="passkey">
<div class="rbw-head" id="head"></div>
<div class="pk-body">
  <div class="pk-intro"><span class="pk-emblem" id="emblem" aria-hidden="true"></span><div><h1 id="title">Sign in with a passkey</h1><span id="rp"></span></div></div>
  <div class="pub-warn" id="public" role="alert" hidden></div>
  <p id="info" class="pk-info" role="status" aria-live="polite"></p>
  <div id="entries" role="group" aria-label="Choose an account"></div>
  <div class="pk-actions">
    <button type="button" id="use">Use passkey</button>
    <button type="button" id="cancel">Cancel request</button>
  </div>
</div>
</body>
</html>
