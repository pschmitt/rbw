[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # this is a timing attack against using the rsa crate for encryption, but
    # we only use rsa decryption here
    "RUSTSEC-2023-0071",
    # (2026-07-03) quick-xml DoS via crafted untrusted XML (quadratic
    # duplicate-attribute check / unbounded namespace allocations), fixed
    # only in quick-xml >= 0.41.0. Our sole quick-xml consumer is
    # wayland-scanner (via wl-clipboard-rs -> wayland-protocols*), a
    # build-time code generator that parses the trusted protocol XML bundled
    # with the wayland crates -- never attacker-controlled input -- so
    # neither advisory is reachable. wayland-scanner still requires
    # quick-xml ^0.39; drop these once it moves to >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
]
skip = [
    # https://github.com/darfink/region-rs/pull/25
    { name = "bitflags", version = "1.3.2" },
    { name = "bitflags", version = "2.4.1" },
    # ssh-agent-lib is holding this back
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror", version = "2.0.17" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "thiserror-impl", version = "2.0.17" },
    # until the rand 0.8 -> 0.9 -> 0.10 transition finished making its way
    # through the crate ecosystem (rand_8 is pinned to 0.8 for `rsa`; some
    # transitive deps are still on 0.9 for other target platforms; rbw's own
    # direct dependency is 0.10)
    { name = "rand", version = "0.8.6" },
    { name = "rand", version = "0.9.4" },
    { name = "rand", version = "0.10.2" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rand_core", version = "0.9.3" },
    { name = "rand_core", version = "0.10.1" },
    { name = "rand_chacha", version = "0.3.1" },
    { name = "rand_chacha", version = "0.9.0" },
    { name = "getrandom", version = "0.2.16" },
    { name = "getrandom", version = "0.3.4" },
    { name = "getrandom", version = "0.4.3" },
    # ratatui's dependency tree pulls this older/extra version in addition to
    # the one the rest of the vault code already uses
    { name = "hashbrown", version = "0.17.1" },
    # `rsa` (and, transitively through it and `ssh-key`, several elliptic
    # curve / ed25519 crates) is still on the digest-0.10-era stack; rbw's
    # own direct dependency on each of these is the newer major. See the
    # `sha1_10`/`rsa::sha2`/`rsa::signature`/`rsa::pkcs8` workarounds in
    # cipherstring.rs and ssh_agent.rs.
    { name = "block-buffer", version = "0.10.4" },
    { name = "block-buffer", version = "0.12.1" },
    { name = "cipher", version = "0.4.4" },
    { name = "cipher", version = "0.5.2" },
    { name = "const-oid", version = "0.9.6" },
    { name = "const-oid", version = "0.10.2" },
    { name = "cpufeatures", version = "0.2.17" },
    { name = "cpufeatures", version = "0.3.1" },
    { name = "crypto-common", version = "0.1.7" },
    { name = "crypto-common", version = "0.2.2" },
    { name = "digest", version = "0.10.7" },
    { name = "digest", version = "0.11.3" },
    { name = "hmac", version = "0.12.1" },
    { name = "hmac", version = "0.13.0" },
    { name = "inout", version = "0.1.4" },
    { name = "inout", version = "0.2.2" },
    { name = "sha1", version = "0.10.6" },
    { name = "sha1", version = "0.11.0" },
    { name = "sha2", version = "0.10.9" },
    { name = "sha2", version = "0.11.0" },
    { name = "signature", version = "2.2.0" },
    { name = "signature", version = "3.0.0" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
exceptions = [
    { name = "ring", allow = ["OpenSSL", "MIT", "ISC"] },
    # EPL-2.0 is OSI-approved weak copyleft; colored_json is consumed
    # unmodified as a regular dependency of the rbw binaries, which EPL-2.0
    # permits without imposing obligations on the rest of the code
    { name = "colored_json", allow = ["EPL-2.0"] },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[[licenses.clarify]]
name = "encoding_rs"
version = "*"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 }
]
