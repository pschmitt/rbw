name: browser extension release
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
      - name: Build extension directories
        run: python3 browser/build.py
      - name: Sign Firefox package with AMO
        run: |
          npm install --global web-ext@8
          web-ext sign \
            --channel=unlisted \
            --source-dir=browser/dist/firefox \
            --artifacts-dir=browser/dist/signed-firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.RBW_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.RBW_AMO_API_SECRET }}
      - name: Sign Chromium package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.RBW_CHROMIUM_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/rbw-chromium.pem"
          printf '%s' "$CRX_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/browser/dist/chromium" \
            --pack-extension-key="$key_file"
          cp browser/dist/signed-firefox/*.xpi browser/packages/rbw-firefox.xpi
          cp browser/dist/chromium.crx browser/packages/rbw-chromium.crx
          rm -f "$key_file"
      - name: Verify signed packages
        run: python3 browser/release.py --output dist
      - name: Create browser extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("browser/dist/firefox/manifest.json"))["version"])')
          gh release create "browser-v$version" dist/rbw-browser-*-firefox.xpi dist/rbw-browser-*-chromium.crx \
            --title "rbw browser extension v$version" \
            --notes "Signed Firefox and Chromium packages for rbw browser extension v$version." \
            --target "$GITHUB_SHA"
