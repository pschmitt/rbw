name: docker-auto
on:
  workflow_run:
    workflows: [docker]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: rbw-auto-image
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Require source commit to be in main history
        id: ancestry
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
          then
            echo "is_ancestor=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ancestor=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: current
        if: steps.ancestry.outputs.is_ancestor == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_digest=$(docker buildx imagetools inspect ghcr.io/pschmitt/rbw:latest --format '{{json .Manifest}}' | jq -r .digest)
          source_digest=$(docker buildx imagetools inspect "ghcr.io/pschmitt/rbw:sha-$SOURCE_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ -n "$latest_digest" && "$latest_digest" == "$source_digest" ]]
          then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        if: steps.ancestry.outputs.is_ancestor == 'true' && steps.current.outputs.is_current == 'true'
        with:
          context: ./auto
          file: ./auto/Dockerfile
          build-args: |
            RBW_IMAGE=ghcr.io/pschmitt/rbw:sha-${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ghcr.io/pschmitt/rbw-auto:sha-${{ github.event.workflow_run.head_sha }}
      - name: Publish latest if the rbw latest image still matches
        if: steps.ancestry.outputs.is_ancestor == 'true' && steps.current.outputs.is_current == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_digest=$(docker buildx imagetools inspect ghcr.io/pschmitt/rbw:latest --format '{{json .Manifest}}' | jq -r .digest)
          source_digest=$(docker buildx imagetools inspect "ghcr.io/pschmitt/rbw:sha-$SOURCE_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$latest_digest" == "$source_digest" ]]
          then
            docker buildx imagetools create \
              --tag ghcr.io/pschmitt/rbw-auto:latest \
              "ghcr.io/pschmitt/rbw-auto:sha-$SOURCE_SHA"
          else
            echo "Skipping latest: rbw:latest moved while rbw-auto was building"
          fi
      # A release tag publishes the image under rbw's version too, like rbw's own.
      - name: Publish the release version
        if: >-
          steps.ancestry.outputs.is_ancestor == 'true' &&
          steps.current.outputs.is_current == 'true' &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/pschmitt/rbw-auto:${TAG#v}" \
            "ghcr.io/pschmitt/rbw-auto:sha-$SOURCE_SHA"
