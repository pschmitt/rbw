name: lint-auto
on:
  push:
    branches: ["main"]
    paths:
      - "auto/**/*.sh"
      - "auto/**/*.py"
      - "auto/pyproject.toml"
      - ".github/workflows/lint-auto.yaml"
  pull_request:
    paths:
      - "auto/**/*.sh"
      - "auto/**/*.py"
      - "auto/pyproject.toml"
      - ".github/workflows/lint-auto.yaml"
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x -- *.sh
        working-directory: auto
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pschmitt/ci-workflows/.github/actions/python-ruff@main
        with:
          python-version: '3.x'
