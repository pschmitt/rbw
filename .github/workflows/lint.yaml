name: lint
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - run: cargo binstall --no-confirm --force cargo-deny
      - run: cargo clippy --all-targets --all-features -- -Dwarnings
      - run: cargo fmt --check
      - run: cargo deny --all-features check
  lint-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm run lint
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      # @master + an explicit toolchain input (rather than the @stable tag)
      # so this always tracks whatever Cargo.toml currently declares.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only our own crates: documenting every dependency took minutes and
      # isn't needed to keep rbw's docs warning-free.
      - run: RUSTDOCFLAGS="-Dwarnings" cargo doc --no-deps --all-features
      - run: cargo test --doc --all-features
