name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # No clipboard feature: arboard has no Android backend.
          - target: aarch64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
        if: matrix.target == 'aarch64-linux-android'
      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo binstall --no-confirm cargo-ndk
      - name: Build (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --release --target x86_64-unknown-linux-musl
      - name: Build (android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo ndk --target aarch64-linux-android --platform 24 -- build --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-linux-android'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          pkg="rbw-${version}-${{ matrix.target }}"
          mkdir "$pkg"
          cp "target/${{ matrix.target }}/release/rbw" \
            "target/${{ matrix.target }}/release/rbw-agent" \
            LICENSE README.md "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: rbw-*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
