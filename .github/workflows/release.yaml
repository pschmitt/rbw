name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  LC_ALL: C
  TZ: UTC
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # No clipboard feature: arboard has no Android backend.
          - target: aarch64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared Rust toolchain
        id: rust
        run: echo "version=$(sed -n 's/^rust-version = \"\(.*\)\"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Set reproducible build environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=." >> "$GITHUB_ENV"
      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
        if: matrix.target == 'aarch64-linux-android'
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo binstall --no-confirm --force cargo-ndk
      - name: Build (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Build (android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo ndk --target aarch64-linux-android --platform 24 -- build --locked --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-linux-android'
        run: cargo build --locked --release --target ${{ matrix.target }}
      # The android binary can't run directly on this (x86_64) runner. Give
      # it a real bionic linker/libc (an actual Android system image; the
      # NDK only ships link-time stub .so's and no linker64 at all) and run
      # it through qemu-user, purely so it can generate its own completions
      # below. Only the ~2MB of extracted files are cached -- the ~1GB
      # image download only happens once, on a cache miss.
      - name: Restore Android bionic runtime cache
        if: matrix.target == 'aarch64-linux-android'
        id: android-bionic-cache
        uses: actions/cache@v6
        with:
          path: android-bionic-sysroot
          key: android-bionic-sysroot-api24-arm64-v1
      - name: Extract Android bionic runtime from a system image
        if: matrix.target == 'aarch64-linux-android' && steps.android-bionic-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/sysimg.zip \
            "https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-24_r27.zip"
          unzip -q -o /tmp/sysimg.zip arm64-v8a/system.img -d /tmp
          mkdir -p android-bionic-sysroot/system/bin android-bionic-sysroot/system/lib64
          debugfs -R "dump /bin/linker64 android-bionic-sysroot/system/bin/linker64" /tmp/arm64-v8a/system.img
          for lib in libc.so libdl.so libm.so liblog.so libc++.so
          do
            debugfs -R "dump /lib64/$lib android-bionic-sysroot/system/lib64/$lib" /tmp/arm64-v8a/system.img
          done
          chmod +x android-bionic-sysroot/system/bin/linker64
          rm -f /tmp/sysimg.zip /tmp/arm64-v8a/system.img
      - name: Install qemu-user-static
        if: matrix.target == 'aarch64-linux-android'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Package
        run: |
          set -o pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          pkg="rbw-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/rbw"
          mkdir "$pkg"
          cp "$bin" \
            "target/${{ matrix.target }}/release/rbw-agent" \
            LICENSE README.md "$pkg/"
          if [[ "${{ matrix.target }}" == "aarch64-linux-android" ]]
          then
            run_bin() {
              qemu-aarch64-static -L "$PWD/android-bionic-sysroot" "$bin" "$@"
            }
          else
            run_bin() { "./$bin" "$@"; }
          fi
          mkdir -p "$pkg/completions/bash" "$pkg/completions/zsh" "$pkg/completions/fish"
          run_bin completions bash > "$pkg/completions/bash/rbw"
          run_bin completions zsh > "$pkg/completions/zsh/_rbw"
          run_bin completions fish > "$pkg/completions/fish/rbw.fish"
          if command -v gtar >/dev/null 2>&1
          then
            tar_bin=gtar
          else
            tar_bin=tar
          fi
          "$tar_bin" --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - "$pkg" |
            gzip -n -9 > "$pkg.tar.gz"
          gzip -t "$pkg.tar.gz"
          "$tar_bin" -tzf "$pkg.tar.gz" > "$pkg.contents"
          grep -Fqx "$pkg/rbw" "$pkg.contents"
          grep -Fqx "$pkg/rbw-agent" "$pkg.contents"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: rbw-*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/dist/*.tar.gz'
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
