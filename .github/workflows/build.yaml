name: build
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check whether signed packages match their source
        id: package-check
        continue-on-error: true
        run: python3 browser/release.py --output dist
      - name: Sign Firefox package with AMO
        if: steps.package-check.outcome == 'failure'
        run: |
          npm install --global web-ext@8
          web-ext sign \
            --channel=unlisted \
            --source-dir=browser/dist/firefox \
            --artifacts-dir=browser/dist/signed-firefox
          cp browser/dist/signed-firefox/*.xpi browser/packages/rbw-firefox.xpi
        env:
          WEB_EXT_API_KEY: ${{ secrets.RBW_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.RBW_AMO_API_SECRET }}
      - uses: browser-actions/setup-chrome@v1
        if: steps.package-check.outcome == 'failure'
      - name: Sign Chromium package
        if: steps.package-check.outcome == 'failure'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.RBW_CHROMIUM_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/rbw-chromium.pem"
          printf '%s' "$CRX_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/browser/dist/chromium" \
            --pack-extension-key="$key_file"
          cp browser/dist/chromium.crx browser/packages/rbw-chromium.crx
          rm -f "$key_file"
      - name: Verify signed browser packages
        run: python3 browser/release.py --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: |
            dist/*.xpi
            dist/*.crx
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: rbw-x86_64-unknown-linux-gnu-debug
          path: |
            target/debug/rbw
            target/debug/rbw-agent
            target/debug/rbw-browser
          if-no-files-found: error
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --all-targets --no-default-features --features clipboard --target x86_64-unknown-linux-musl
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - run: cargo binstall --no-confirm --force cargo-ndk
      - run: cargo ndk --target aarch64-linux-android --platform 24 -- build --all-targets --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs .#
