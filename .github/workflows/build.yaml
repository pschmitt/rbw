name: build
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Every push and pull request: unsigned packages for temporary loading
  # (Firefox about:debugging, Chromium "Load unpacked" after unzipping).
  browser-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check extension scripts
        run: |
          for script in browser/extension/*.js
          do
            node --check "$script"
          done
      - name: Build unsigned browser packages
        run: python3 browser/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions-unsigned
          path: |
            browser/dist/rbw-firefox.zip
            browser/dist/rbw-chromium.zip
          if-no-files-found: error
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check whether signed packages match their source
        id: package-check
        continue-on-error: true
        run: python3 browser/release.py --output dist
      # AMO signs each version once, so only sign a version that has no signed
      # package yet (a release commit). Other extension changes just wait for
      # the next release instead of failing the signing step.
      - name: Decide whether to sign
        id: sign
        if: steps.package-check.outcome == 'failure'
        run: |
          source=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          packaged=$(python3 -c 'import json, zipfile; print(json.loads(zipfile.ZipFile("browser/packages/rbw-firefox.xpi").read("manifest.json"))["version"])')
          if [[ "$source" == "$packaged" ]]
          then
            echo "::notice::Extension sources changed since the signed $packaged packages; they are signed on the next release commit."
          else
            echo "needed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign Firefox package with AMO
        if: steps.sign.outputs.needed == '1'
        run: |
          npm install --global web-ext@8
          web-ext sign \
            --channel=unlisted \
            --source-dir=browser/dist/firefox \
            --artifacts-dir=browser/dist/signed-firefox
          cp browser/dist/signed-firefox/*.xpi browser/packages/rbw-firefox.xpi
        env:
          WEB_EXT_API_KEY: ${{ secrets.RBW_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.RBW_AMO_API_SECRET }}
      - uses: browser-actions/setup-chrome@v2
        if: steps.sign.outputs.needed == '1'
      - name: Sign Chromium package
        if: steps.sign.outputs.needed == '1'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.RBW_CHROMIUM_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/rbw-chromium.pem"
          printf '%s' "$CRX_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/browser/dist/chromium" \
            --pack-extension-key="$key_file"
          cp browser/dist/chromium.crx browser/packages/rbw-chromium.crx
          rm -f "$key_file"
      - name: Verify signed browser packages
        if: steps.package-check.outcome == 'success' || steps.sign.outputs.needed == '1'
        run: python3 browser/release.py --output dist
      - uses: actions/upload-artifact@v7
        if: steps.package-check.outcome == 'success' || steps.sign.outputs.needed == '1'
        with:
          name: browser-extensions
          path: |
            dist/*.xpi
            dist/*.crx
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: rbw-x86_64-unknown-linux-gnu-debug
          path: |
            target/debug/rbw
            target/debug/rbw-agent
            target/debug/rbw-browser
          if-no-files-found: error
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --all-targets --no-default-features --features clipboard --target x86_64-unknown-linux-musl
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - run: cargo binstall --no-confirm --force cargo-ndk
      - run: cargo ndk --target aarch64-linux-android --platform 24 -- build --all-targets --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Keep the Nix store between runs; with crane, rbw's dependencies are a
      # separate derivation that only changes with Cargo.lock or the toolchain.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs .#
