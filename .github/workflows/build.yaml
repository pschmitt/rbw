name: build
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Every push and pull request: unsigned packages for temporary loading
  # (Firefox about:debugging, Chromium "Load unpacked" after unzipping).
  # The release workflow signs them when a version is tagged.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check extension scripts
        run: |
          for script in browser/extension/*.js browser/browser-daemon/*.js
          do
            node --check "$script"
          done
      - name: Check clipboard safety and WebAuthn provider cooperation
        run: node --test browser/tests/clipboard.mjs browser/tests/webauthn.mjs browser/tests/passkey-shim.mjs browser/tests/fill-targets.mjs
      - name: Build unsigned browser packages
        run: python3 browser/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions-unsigned
          path: |
            browser/dist/rbw-firefox.zip
            browser/dist/rbw-chromium.zip
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: rbw-x86_64-unknown-linux-gnu-debug
          path: |
            target/debug/rbw
            target/debug/rbw-agent
            target/debug/rbw-browser
          if-no-files-found: error
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --all-targets --no-default-features --features clipboard --target x86_64-unknown-linux-musl
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - run: cargo binstall --no-confirm --force cargo-ndk
      - run: cargo ndk --target aarch64-linux-android --platform 24 -- build --all-targets --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3 cache;
  # see pschmitt/ci-workflows. The Android NDK behind rbw-termux only runs on x86_64 Linux.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      exclude: '["rbw-termux"]'
      pin-prefix: gh-rbw-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
