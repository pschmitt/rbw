name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Every push and pull request: unsigned packages for temporary loading
  # (Firefox about:debugging, Chromium "Load unpacked" after unzipping).
  # The release workflow signs them when a version is tagged.
  browser-extensions:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check extension scripts
        run: |
          for script in browser/extension/*.js browser/browser-daemon/*.js
          do
            node --check "$script"
          done
      - name: Check clipboard safety and WebAuthn provider cooperation
        run: node --test browser/tests/clipboard.mjs browser/tests/webauthn.mjs browser/tests/passkey-shim.mjs browser/tests/fill-targets.mjs browser/tests/error-detail.mjs browser/tests/top-layer.mjs
      - name: Build unsigned browser packages
        run: python3 browser/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions-unsigned
          path: |
            browser/dist/rbw-firefox.zip
            browser/dist/rbw-chromium.zip
          if-no-files-found: error
  build:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: rbw-x86_64-unknown-linux-gnu-debug
          path: |
            target/debug/rbw
            target/debug/rbw-agent
            target/debug/rbw-browser
          if-no-files-found: error
  build-musl:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --all-targets --no-default-features --features clipboard --target x86_64-unknown-linux-musl
  build-macos:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
  build-android:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # cross-rs's aarch64-linux-android image bundles a pre-r18 standalone
      # NDK toolchain with no libunwind, which current rustc requires at
      # link time (`ld: cannot find -lunwind`) - build against a real NDK
      # via cargo-ndk instead.
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores binstall's install manifest but not the
      # binary itself, so without it binstall skips the (missing) install
      - run: cargo binstall --no-confirm --force cargo-ndk
      - run: cargo ndk --target aarch64-linux-android --platform 24 -- build --all-targets --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3 cache;
  # see pschmitt/ci-workflows. The Android NDK behind rbw-termux only runs on x86_64 Linux.
  nix-aarch64:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      exclude: '["rbw-termux"]'
      pin-prefix: gh-rbw-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64-checks:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    needs: nix-aarch64
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      full-flake-check: false
      pin-prefix: gh-rbw-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  # Images are published on pushes and manual runs, never on pull requests.
  docker:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pschmitt/ci-workflows/.github/workflows/docker-native.yaml@main
    with:
      image-name: pschmitt/rbw

  rbw-auto:
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./auto
          file: ./auto/Dockerfile
          build-args: |
            RBW_IMAGE=ghcr.io/pschmitt/rbw:sha-${{ github.sha }}
          push: true
          tags: ghcr.io/pschmitt/rbw-auto:sha-${{ github.sha }}
      # Runs for different refs can overlap; only move latest if rbw still matches.
      - name: Publish latest if the rbw latest image still matches
        run: |
          latest_digest=$(docker buildx imagetools inspect ghcr.io/pschmitt/rbw:latest --format '{{json .Manifest}}' | jq -r .digest)
          source_digest=$(docker buildx imagetools inspect "ghcr.io/pschmitt/rbw:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ -n "$latest_digest" && "$latest_digest" == "$source_digest" ]]
          then
            docker buildx imagetools create \
              --tag ghcr.io/pschmitt/rbw-auto:latest \
              "ghcr.io/pschmitt/rbw-auto:sha-$GITHUB_SHA"
          else
            echo "Skipping latest: rbw:latest is not this commit's image"
          fi
      - name: Publish the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/pschmitt/rbw-auto:${GITHUB_REF_NAME#v}" \
            "ghcr.io/pschmitt/rbw-auto:sha-$GITHUB_SHA"
