name: docker
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  # Resolves to ghcr.io/pschmitt/rbw for this repo.
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  # Each architecture builds natively (no QEMU) and pushes its image by
  # digest; the merge job below joins them into one multi-arch manifest.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Layers (notably cargo-chef's dependency layer) are cached per
      # architecture in the GitHub Actions cache.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ steps.platform.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.platform.outputs.pair }}
      - run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      # `:latest` tracks every push to main, not just tagged releases; the
      # raw Cargo.toml version (e.g. `2.11.0`, deliberately without the `v`
      # prefix git tags use, matching the tarball naming in release.yaml)
      # is only added as an extra tag when this run was triggered by an
      # actual version tag push.
      - id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          tags="-t ${{ env.IMAGE }}:latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]
          then
            tags="${tags} -t ${{ env.IMAGE }}:${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create ${{ steps.meta.outputs.tags }} \
            --annotation "index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect "${{ env.IMAGE }}:latest"
