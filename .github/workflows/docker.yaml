name: docker
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  # Resolves to ghcr.io/pschmitt/rbw for this repo.
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # `:latest` tracks every push to main, not just tagged releases; the
      # raw Cargo.toml version (e.g. `2.11.0`, deliberately without the `v`
      # prefix git tags use, matching the tarball naming in release.yaml)
      # is only added as an extra tag when this run was triggered by an
      # actual version tag push.
      - id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          tags="${{ env.IMAGE }}:latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]
          then
            tags="${tags}"$'\n'"${{ env.IMAGE }}:${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # arm64 has no native GitHub-hosted runner here, so it's built via
      # QEMU emulation in the same job rather than a separate native
      # runner/matrix -- slower per-arch, but keeps this to one job and one
      # multi-arch manifest push instead of coordinating two.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
