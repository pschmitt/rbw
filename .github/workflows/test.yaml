name: test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev dbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - name: Check native fingerprint protocol and cancellation
        run: dbus-run-session -- env RBW_TEST_PRIVATE_DBUS=1 cargo test --lib --all-features desktop::protocol_tests::fingerprint_protocol_and_cleanup -- --ignored
  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo test --no-default-features --features clipboard --target x86_64-unknown-linux-musl
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
  # The browser extension in a real Chromium and Firefox against a stub
  # native host (browser/tests/e2e): the inline autofill UI, its clickjacking
  # defences and the save prompts, with trusted input events. The page.html
  # run is the plain case, csp.html the same page under a strict CSP.
  test-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        page: [page.html, csp.html]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # run.sh takes its Python environment and browsers from the nixpkgs in
      # the flake registry, which would otherwise be whatever is newest on the
      # day; pin it to the flake's own revision so runs match and the cache
      # below stays valid.
      - run: nix registry pin nixpkgs "github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)"
      # Keep the Nix store (the browser and the Python environment) between
      # runs, per browser.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-e2e-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'browser/tests/e2e/run.sh') }}
          restore-prefixes-first-match: nix-e2e-${{ matrix.browser }}-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - run: browser/tests/e2e/run.sh ${{ matrix.browser }} ${{ matrix.page }}
  # Real-server tests, distinct from `test`'s mocked-HTTP unit tests: these
  # register an actual account on a throwaway Vaultwarden container and
  # drive the built `rbw` binary against it over the real wire protocol,
  # to catch the class of bug unit tests can't see (e.g. a server round
  # trip silently dropping data an edit didn't touch). See
  # .github/e2e/e2e.bats for what's covered and why.
  e2e:
    runs-on: ubuntu-latest
    # A stalled test here would otherwise ride GitHub's default 6h job
    # timeout (see the `wait_for_exit` fix in src/bin/rbw/actions.rs for
    # one real way this suite already managed to hang); every green run
    # so far has taken well under a minute.
    timeout-minutes: 60
    services:
      vaultwarden:
        image: vaultwarden/server:latest
        env:
          SIGNUPS_ALLOWED: "true"
          SHOW_PASSWORD_HINT: "false"
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          # The suite logs in far more often than a person would; the
          # default (10 logins per minute) makes it flaky.
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          ADMIN_RATELIMIT_SECONDS: "1"
          ADMIN_RATELIMIT_MAX_BURST: "1000"
        ports:
          - 8000:80
        options: >-
          --health-cmd "curl -f http://localhost/alive || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--example` alone restricts the build to just that example; the
      # e2e suite also needs the `rbw`/`rbw-agent` bins (see e2e.bats'
      # assumption that `cargo build --workspace` already produced them).
      - run: cargo build --workspace --bins --example e2e_register_account
      # Installed from source at a pinned tag rather than the distro
      # package, so the bats version (and its $BATS_FILE_TMPDIR support,
      # needed by e2e.bats to share state across tests) doesn't drift with
      # the runner image.
      - run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - run: bats .github/e2e/e2e.bats </dev/null
        env:
          # Fail a hung test (e.g. one waiting on stdin) instead of the job.
          BATS_TEST_TIMEOUT: "300"
          VAULTWARDEN_URL: http://localhost:8000
