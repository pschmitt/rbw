[package]
name = "rbw"
version = "2.17.4"
authors = ["Philipp Schmitt <philipp@schmitt.co>", "Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.89.0"

description = "Unofficial Bitwarden CLI"
repository = "https://github.com/doy/rbw"
readme = "README.md"
keywords = ["bitwarden"]
categories = ["command-line-utilities", "cryptography"]
license = "MIT"
include = ["src/**/*", "bin/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
aes = "0.9.0"
aes-gcm = "0.11.0"
anyhow = "1.0.100"
argon2 = "0.6.0"
arrayvec = "0.7.6"
axum = "0.8.8"
base32 = "0.5.1"
base64 = "0.22.1"
block-padding = "0.4.0"
cbc = { version = "0.2.0", features = ["alloc"] }
csv = "1.4.0"
clap_complete = "4.5.62"
clap = { version = "4.5.53", features = ["wrap_help", "derive"] }
clap_complete_nushell = "4.5.10"
clap_complete_fig = "4.5.2"
colored_json = "5.0.0"
daemonix = "0.1.0"
directories = "6.0.0"
env_logger = "0.11.8"
flate2 = "1.1.9"
futures = "0.3.31"
futures-channel = "0.3.31"
futures-util = "0.3.31"
hkdf = "0.13.0"
hmac = "0.13.0"
humantime = "2.3.0"
indicatif = "0.18.6"
is-terminal = "0.4.17"
libc = "0.2.178"
log = "0.4.29"
open = "5.3.3"
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
# pkcs8 was a direct dependency only for `DecodePrivateKey`/`DecodePublicKey`
# on `rsa` types; that only compiles against the pkcs8 version `rsa` itself
# depends on (see `rsa::pkcs8` usage in cipherstring.rs), so bumping it here
# independently of `rsa` breaks the build with no upside -- removed.
# TODO: necessary because `rsa` (not in the lockstep bump group) still
# depends on rand_core 0.6 via rand 0.8
rand_8 = { package = "rand", version = "0.8.5" }
rand = "0.10.0"
ratatui = "0.30.2"
regex = "1.12.2"
region = "4"
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls-native-roots",
] }
rmpv = "1.3.0"
rsa = "0.9.9"
rustix = { version = "1.1.3", features = [
    "termios",
    "process",
    "pipe",
] }
serde_json = "1.0.147"
serde_path_to_error = "0.1.20"
serde_repr = "0.1.20"
serde = { version = "1.0.228", features = ["derive"] }
# `rsa` (not in the lockstep bump group) still needs digest 0.10-era
# `Sha1`/`Digest`/`DecodePrivateKey`/`DecodePublicKey` impls for its OAEP and
# PKCS1v15 signing APIs; it re-exports a compatible `sha2` and `pkcs8` itself
# (used as `rsa::sha2`/`rsa::pkcs8`) but not `sha1`, hence this alias.
sha1_10 = { package = "sha1", version = "0.10.6" }
sha1 = "0.11.0"
sha2 = "0.11.0"
signature = "3"
ssh-agent-lib = "0.6.0"
tar = "0.4.46"
tempfile = "3.24.0"
terminal_size = "0.4.3"
textwrap = "0.16.2"
thiserror = "2.0.17"
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-tungstenite = { version = "0.30", features = [
    "rustls-tls-native-roots",
    "url",
] }
tokio = { version = "1.48.0", features = ["full"] }
totp-rs = { version = "6", features = ["steam"] }
url = "2.5.7"
urlencoding = "2.1.3"
unicode-width = "0.2.2"
uuid = { version = "1.19.0", features = ["v4"] }
zeroize = "1.8.2"
serde_yaml = "0.9.34"
yansi = "1.0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
dotenvy = "0.15.7"

[features]
default = ["clipboard"]
clipboard = ["arboard"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
as_conversions = "warn"
get_unwrap = "warn"
cognitive_complexity = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
multiple_crate_versions = "allow"
large_enum_variant = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"

[package.metadata.deb]
depends = "pinentry"
license-file = ["LICENSE"]
assets = [
    [
        "target/release/rbw",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/rbw-agent",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/completion/bash",
        "usr/share/bash-completion/completions/rbw",
        "644",
    ],
    [
        "target/release/completion/zsh",
        "usr/share/zsh/vendor-completions/_rbw",
        "644",
    ],
    [
        "target/release/completion/fish",
        "usr/share/fish/completions/rbw.fish",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/rbw/README",
        "644",
    ],
]
