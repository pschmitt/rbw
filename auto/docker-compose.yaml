# Example: a nightly encrypted backup and a mirror every six hours, scheduled
# by cron inside the container. Credentials are Docker secrets; config.json
# points rbw at them (see docs/auto.md).
services:
  rbw:
    image: ghcr.io/pschmitt/rbw-auto:latest
    build: .
    entrypoint: ["cron", "-f"]
    restart: unless-stopped
    volumes:
      - ./config:/root/.config/rbw:ro
      - ./crontab:/etc/cron.d/rbw:ro
      - state:/root/.local/share/rbw
      - ./data:/data
    secrets:
      - personal-password
      - personal-totp
      - vaultwarden-password
      - backup-passphrase

secrets:
  personal-password:
    file: ./secrets/personal-password
  personal-totp:
    file: ./secrets/personal-totp
  vaultwarden-password:
    file: ./secrets/vaultwarden-password
  backup-passphrase:
    file: ./secrets/backup-passphrase

volumes:
  state:
